<!-- استدعاء مكتبات Firebase من السيرفر -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
    // 1. ضع معلومات الربط الخاصة بمشروعك من Firebase Console هنا:
    const firebaseConfig = {
          apiKey: "AIzaSyCKsrKQwcwdrFFNkomE8KghUixP4o4AfoM",
  authDomain: "sia-requests-app.firebaseapp.com",
  databaseURL: "https://sia-requests-app-default-rtdb.firebaseio.com",
  projectId: "sia-requests-app",
  storageBucket: "sia-requests-app.firebasestorage.app",
  messagingSenderId: "906533362131",
  appId: "1:906533362131:web:383edf5cecab22ebbc7726",
  measurementId: "G-BHDDEWH8HN"
    };

    // 2. تهيئة التطبيق والاتصال بقاعدة البيانات
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const requestsRef = db.ref('sia_requests');
    const countersRef = db.ref('sia_counters');

    let migratedRequests = [];
    let statementAutoCounter = 1;
    let mapAutoCounter = 1;

    window.onload = function() {
        document.getElementById('reqDate').value = new Date().toISOString().split('T')[0];
        
        addPropertyBox();
        addPropertyBox();
        addPropertyBox();

        document.querySelectorAll('.input-panel input, .input-panel select').forEach(element => {
            element.addEventListener('input', updatePreview);
        });

        // الاستماع التلقائي لقاعدة البيانات (مباشر ولحظي لكل المستخدمين)
        listenToDatabase();
        listenToCounters();
    };

    // استماع لحظي للطلبات عند حدوث أي تعديل من أي موظف
    function listenToDatabase() {
        requestsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            migratedRequests = [];
            if (data) {
                // تحويل الكائن القادم من قاعدة البيانات إلى مصفوفة
                Object.keys(data).forEach(key => {
                    migratedRequests.push({ firebaseKey: key, ...data[key] });
                });
                // ترتيب الطلبات من الأحدث إلى الأقدم
                migratedRequests.sort((a, b) => b.id - a.id);
            }
            renderTrackingTable();
        });
    }

    // استماع للعدادات المباشرة التلقائية
    function listenToCounters() {
        countersRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                statementAutoCounter = data.statementAutoCounter || 1;
                mapAutoCounter = data.mapAutoCounter || 1;
            }
            handleRequestTypeChange();
        });
    }

    function handleRequestTypeChange() {
        const type = document.getElementById('requestType').value;
        const reqNumInput = document.getElementById('reqNumber');

        if (type === 'statement') {
            reqNumInput.value = 'ب ع ' + String(statementAutoCounter).padStart(3, '0');
        } else {
            reqNumInput.value = 'م س ' + String(mapAutoCounter).padStart(3, '0');
        }
        updatePreview();
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');

        if(tabId === 'tab-generate') {
            document.getElementById('btnTab1').classList.add('active');
        } else {
            document.getElementById('btnTab2').classList.add('active');
        }
    }

    function addPropertyBox(val = '') {
        const container = document.getElementById('propertiesContainer');
        const div = document.createElement('div');
        div.className = 'prop-item';
        div.innerHTML = `
            <input type="text" class="prop-input-val" value="${val}" placeholder="عقار" oninput="updatePreview()">
            <button type="button" class="btn-remove" onclick="removePropertyBox(this)">×</button>
        `;
        container.appendChild(div);
        updatePreview();
    }

    function removePropertyBox(btn) {
        btn.parentElement.remove();
        updatePreview();
    }

    function getPropertiesList() {
        const inputs = document.querySelectorAll('.prop-input-val');
        const list = [];
        inputs.forEach(input => {
            const v = input.value.trim();
            if (v !== '') list.push(v);
        });
        return list;
    }

    function updatePreview() {
        const reqNum = document.getElementById('reqNumber').value || '---';
        const reqDate = document.getElementById('reqDate').value || '---';
        const project = document.getElementById('projectName').value || '................';
        const zone = document.getElementById('realEstateZone').value || '................';
        const requestType = document.getElementById('requestType').value;
        const properties = getPropertiesList();
        const propCount = properties.length;

        document.getElementById('outNumber').innerText = reqNum;
        document.getElementById('outDate').innerText = reqDate;
        document.getElementById('outTableReqNum').innerText = reqNum;
        document.getElementById('outTableReqDate').innerText = reqDate;
        document.getElementById('outTableProject').innerText = project;

        let typeTerm = '';
        if (requestType === 'statement') {
            typeTerm = propCount > 1 ? 'بيانات عقارية' : 'بيان عقاري';
        } else {
            typeTerm = propCount > 1 ? 'مخططات مساحية' : 'مخطط مساحي';
        }

        const bodyElem = document.getElementById('outRequestBody');
        const attachNote = document.getElementById('outAttachmentsNote');
        const tablePage = document.getElementById('attachedTablePage');

        const introText = "استناداً إلى أحكام المرسوم (114) لعام (2025) وتعليماته التنفيذية وإلى البلاغ رقم (7) لعام (2025).";
        let mainText = "";

        if (propCount > 5) {
            mainText = `يرجى الإيعاز لمن يلزم لتزويد هيئة الاستثمار السورية فرع حلب بـ<strong>${typeTerm}</strong> للعقارات الموضحة بالجدول المرفق طياً وذلك ضمن إطار مشروع (${project}).`;
            attachNote.style.display = 'block';
            tablePage.style.display = 'block';
            renderTableRows(properties, zone);
        } else {
            const propsStr = properties.length > 0 ? properties.join(' ، ') : '................';
            const propLabel = properties.length > 1 ? 'للعقارات' : 'للعقار';
            mainText = `يرجى الإيعاز لمن يلزم لتزويد هيئة الاستثمار السورية فرع حلب بـ<strong>${typeTerm}</strong> ${propLabel} (${propsStr}) من المنطقة العقارية (${zone}) وذلك ضمن إطار مشروع (${project}).`;
            attachNote.style.display = 'none';
            tablePage.style.display = 'none';
        }

        bodyElem.innerHTML = `
            <div class="doc-intro">${introText}</div>
            <div class="doc-text">${mainText}</div>
        `;

        const signatureElem = document.getElementById('outSignature');
        if (requestType === 'statement') {
            signatureElem.innerHTML = `مدير إدارة المشاريع<br>في فرع هيئة الاستثمار السورية بحلب<br>الأستاذ صهيب بوشي`;
        } else {
            signatureElem.innerHTML = `مدير فرع هيئة الاستثمار السورية بحلب<br>المهندس محمد حازم لطفي`;
        }
    }

    function renderTableRows(properties, zone) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        properties.forEach((propNum, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${index + 1}</td><td>${propNum}</td><td>${zone}</td>`;
            tbody.appendChild(tr);
        });
    }

    // حفظ الطلب في قاعدة البيانات السحابية بدلاً من localStorage
    function submitAndMigrate() {
        const requestType = document.getElementById('requestType').value;
        const reqNum = document.getElementById('reqNumber').value.trim();
        const reqDate = document.getElementById('reqDate').value;
        const requester = document.getElementById('requesterName').value.trim() || 'غير محدد';
        const project = document.getElementById('projectName').value.trim() || '---';
        const zone = document.getElementById('realEstateZone').value.trim() || '---';
        const properties = getPropertiesList();

        let typeText = (requestType === 'statement') ? 
            (properties.length > 1 ? 'بيانات عقارية' : 'بيان عقاري') : 
            (properties.length > 1 ? 'مخططات مساحية' : 'مخطط مساحي');

        const newRecord = {
            id: Date.now(),
            reqNum: reqNum,
            reqDate: reqDate,
            requesterName: requester,
            requestType: typeText,
            properties: properties.length > 0 ? properties.join('، ') : 'مرفق بجدول',
            zone: zone,
            project: project,
            status: 'تم الطلب'
        };

        // دفع البيانات السحابية (Push to Firebase)
        requestsRef.push(newRecord);

        // تحديث العداد في السحاب
        if (requestType === 'statement') {
            statementAutoCounter++;
        } else {
            mapAutoCounter++;
        }
        countersRef.set({
            statementAutoCounter: statementAutoCounter,
            mapAutoCounter: mapAutoCounter
        });

        alert('تم ترحيل الطلب بنجاح إلى قاعدة البيانات السحابية برقم: ' + reqNum);
        handleRequestTypeChange();
    }

    function renderTrackingTable() {
        const tbody = document.getElementById('trackingTbody');
        document.getElementById('badgeCount').innerText = migratedRequests.length;
        tbody.innerHTML = '';

        if(migratedRequests.length === 0) {
            tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: #64748b; padding: 20px;">لا توجد طلبات مرجّلة حالياً</td></tr>`;
            return;
        }

        const statusOptions = [
            'تم الطلب',
            'تم الحصول على البيانات أو المخططات',
            'تم سحبهم ضوئياً',
            'تم تحميلهم في قاعدة البيانات',
            'تم الاطلاع عليهم',
            'تم إرفاقهم في الإضبارة'
        ];

        migratedRequests.forEach((item, index) => {
            const tr = document.createElement('tr');
            let optionsHTML = statusOptions.map(opt => 
                `<option value="${opt}" ${item.status === opt ? 'selected' : ''}>${opt}</option>`
            ).join('');

            tr.innerHTML = `
                <td style="font-weight: bold; text-align: center;">${migratedRequests.length - index}</td>
                <td><strong>${item.reqNum}</strong></td>
                <td>${item.reqDate}</td>
                <td>${item.requesterName}</td>
                <td>${item.requestType}</td>
                <td>${item.properties}</td>
                <td>${item.zone}</td>
                <td>${item.project}</td>
                <td>
                    <select class="status-select" onchange="updateRecordStatus('${item.firebaseKey}', this.value)">
                        ${optionsHTML}
                    </select>
                </td>
                <td style="text-align: center;">
                    <button class="btn-delete" onclick="deleteRecord('${item.firebaseKey}')">حذف</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // تحديث حالة الطلب أونلاين لحظياً
    function updateRecordStatus(key, newStatus) {
        db.ref('sia_requests/' + key).update({ status: newStatus });
    }

    // حذف الطلب أونلاين من السحابة
    function deleteRecord(key) {
        if(confirm('هل أنت تأكد من حذف هذا الطلب من قاعدة البيانات السحابية؟')) {
            db.ref('sia_requests/' + key).remove();
        }
    }
</script>
